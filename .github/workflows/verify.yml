name: 验证客户端与管理端

on:
  push:
    branches: [main]
    paths: ['client/**', 'management/**', '.github/**']
  pull_request:
    branches: [main]
    paths: ['client/**', 'management/**', '.github/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: 客户端离线回归与构建
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: 验证发布门禁与工作流配置
        run: >-
          node --test
          .github/scripts/prepare-client-release.test.mjs
          .github/scripts/publish-r2-release.test.mjs
          .github/scripts/verify-worker-release.test.mjs
          .github/scripts/release-workflow.test.mjs
          .github/scripts/build-management-workflow.test.mjs
          .github/scripts/ci-upgrade-workflow.test.mjs
          analytics/worker/src/routes/updates.test.js
          client/scripts/package-build-config.test.cjs
      - name: 安装客户端锁定依赖
        working-directory: client
        run: npm ci
      - name: 准备并校验 Electron 可执行文件
        working-directory: client
        run: node scripts/ensure-electron-binary.cjs --platform win32 --arch x64
      - name: 准备固定来源的公开 PPT 样本
        working-directory: client
        run: npm run prepare-ppt-test-fixtures
      - name: 验证真实 SDK 离线契约与本地授权
        working-directory: client
        run: npm run test:ci-upgrade
      - name: 验证真实 Electron 原生依赖
        working-directory: client
        run: npm run smoke:electron-native
      - name: 验证真实 Electron Pi 与隔离资源协议
        working-directory: client
        run: |
          npm run smoke:pi-upgrade -- .tmp/ci/pi-electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron scripts/resource-client-electron-smoke.cjs
      - name: 构建客户端
        working-directory: client
        run: npm run build
  management:
    name: 管理端授权与资源回归及构建
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: management
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: management/package-lock.json
      - name: 安装管理端锁定依赖
        run: npm ci
      - name: 验证管理端授权与资源
        run: npm test
      - name: 构建管理端
        run: npm run build
