name: Release Client and Management
run-name: Release Client ${{ inputs.tag_name }} and Management ${{ inputs.management_version }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing stable release tag, for example v1.3.2'
        required: true
        type: string
      confirm_release:
        description: 'Type PUBLISH vX.Y.Z to publish the selected tag'
        required: true
        type: string
      management_version:
        description: 'Independent management version, for example 1.4.3 or v1.4.3'
        required: true
        type: string
      management_ref:
        description: 'Commit, tag, or ref from main history to build for management'
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: openjatobid-release
  cancel-in-progress: false

env:
  RIPGREP_VERSION: ${{ vars.RIPGREP_VERSION || '14.1.1' }}
  FD_VERSION: ${{ vars.FD_VERSION || 'v10.3.0' }}
  JQ_VERSION: ${{ vars.JQ_VERSION || 'jq-1.7.1' }}

jobs:
  release-preflight:
    name: Inspect existing release state
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    outputs:
      client_mode: ${{ steps.client-state.outputs.client_mode }}
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      CONFIRM_RELEASE: ${{ inputs.confirm_release }}
    steps:
      - name: Checkout exact client tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Inspect published client Release
        id: client-state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release tag: $env:TAG_NAME"
          }
          $expectedConfirmation = "PUBLISH $env:TAG_NAME"
          if ($env:CONFIRM_RELEASE -cne $expectedConfirmation) {
            throw "confirm_release must exactly equal '$expectedConfirmation'."
          }

          $releaseOutput = gh release view $env:TAG_NAME --json isDraft,isPrerelease,tagName,assets 2>&1
          $releaseExitCode = $LASTEXITCODE
          if ($releaseExitCode -ne 0) {
            if (($releaseOutput | Out-String) -notmatch 'release not found') {
              throw "Unable to inspect client Release $env:TAG_NAME`: $releaseOutput"
            }
            "client_mode=release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $release = $releaseOutput | ConvertFrom-Json
          if ($release.isDraft) {
            "client_mode=release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          if ($release.isPrerelease -or $release.tagName -cne $env:TAG_NAME) {
            throw "Existing client Release $env:TAG_NAME is not a published stable release."
          }
          $version = $env:TAG_NAME.Substring(1)
          $expectedAssets = @("Jato-AI-BID-$version-win-x64.exe", 'manifest.json') | Sort-Object
          $actualAssets = @($release.assets | ForEach-Object { $_.name }) | Sort-Object
          if (($expectedAssets -join "`n") -cne ($actualAssets -join "`n")) {
            throw "Published client Release $env:TAG_NAME does not contain the exact official asset whitelist."
          }
          "client_mode=skip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Client Release $env:TAG_NAME is already published; only management release work will continue."
          exit 0

  release-client:
    name: Release Windows client
    needs: release-preflight
    if: ${{ needs.release-preflight.outputs.client_mode == 'release' }}
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      CONFIRM_RELEASE: ${{ inputs.confirm_release }}
      WORKFLOW_SOURCE_SHA: ${{ github.sha }}
      CSC_LINK: ''
      WIN_CSC_LINK: ''
      CSC_KEY_PASSWORD: ''
      WIN_CSC_KEY_PASSWORD: ''
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Validate release tag, confirmation, and checkout commit
        id: release
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release tag: $env:TAG_NAME"
          }
          $expectedConfirmation = "PUBLISH $env:TAG_NAME"
          if ($env:CONFIRM_RELEASE -cne $expectedConfirmation) {
            throw "confirm_release must exactly equal '$expectedConfirmation'."
          }
          $commitSha = (git rev-parse HEAD).Trim()
          $tagCommitSha = (git rev-list -n 1 $env:TAG_NAME).Trim()
          if ($env:WORKFLOW_SOURCE_SHA -cne $tagCommitSha) {
            throw "GitHub Actions workflow source commit $env:WORKFLOW_SOURCE_SHA does not match release tag commit $tagCommitSha. Start a new workflow run from the tag commit; rerunning an older run reuses its original workflow."
          }
          if ($commitSha -cne $tagCommitSha) {
            throw "Checkout commit $commitSha does not match tag commit $tagCommitSha."
          }
          $version = $env:TAG_NAME.Substring(1)
          "tag_name=$env:TAG_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "commit_sha=$commitSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: GitHub-hosted Windows tool preflight
        run: |
          $ErrorActionPreference = 'Stop'
          git --version
          node --version
          npm --version
          $awsVersion = (aws --version 2>&1 | Out-String).Trim()
          Write-Host $awsVersion
          if ($awsVersion -notmatch '^aws-cli/2\.') {
            throw 'AWS CLI v2 is required on the GitHub-hosted release runner.'
          }
          gh --version

      - name: Test release scripts and Worker update routes
        run: |
          $ErrorActionPreference = 'Stop'
          node --test `
            .github/scripts/prepare-client-release.test.mjs `
            .github/scripts/publish-r2-release.test.mjs `
            .github/scripts/verify-worker-release.test.mjs `
            .github/scripts/release-workflow.test.mjs `
            .github/scripts/build-management-workflow.test.mjs `
            analytics/worker/src/routes/updates.test.js `
            client/scripts/package-build-config.test.cjs

      - name: Preflight Worker test license
        env:
          UPDATE_WORKER_BASE_URL: ${{ vars.UPDATE_WORKER_BASE_URL }}
          JATOBID_UPDATE_TEST_LICENSE_JSON: ${{ secrets.JATOBID_UPDATE_TEST_LICENSE_JSON }}
          WORKER_RELEASE_VERIFY_MODE: license
        run: node .github/scripts/verify-worker-release.mjs

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Test update integrity checks
        working-directory: client
        run: npm run test:update

      - name: Prepare Agent tools
        working-directory: client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RIPGREP_VERSION: ${{ env.RIPGREP_VERSION }}
          FD_VERSION: ${{ env.FD_VERSION }}
          JQ_VERSION: ${{ env.JQ_VERSION }}
        run: node scripts/prepare-agent-tools.cjs --platform win32 --arch x64

      - name: Verify Agent tools
        working-directory: client
        run: node scripts/verify-agent-tools.cjs --platform win32 --arch x64

      - name: Rebuild Electron native dependencies
        working-directory: client
        run: npm run postinstall

      - name: Ensure Electron binary is installed
        working-directory: client
        run: node scripts/ensure-electron-binary.cjs --platform win32 --arch x64

      - name: Smoke test Electron native dependencies
        working-directory: client
        run: npm run smoke:electron-native

      - name: Sync package version from tag
        working-directory: client
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm version "$env:RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Generate signed build attestation
        working-directory: client
        env:
          JATOBID_BUILD_ATTESTATION_PRIVATE_KEY_JWK: ${{ secrets.JATOBID_BUILD_ATTESTATION_PRIVATE_KEY_JWK }}
          JATOBID_BUILD_ATTESTATION_KEY_ID: ${{ vars.JATOBID_BUILD_ATTESTATION_KEY_ID || 'jatobid-build-key-2026-07' }}
          GIT_COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:JATOBID_BUILD_ATTESTATION_PRIVATE_KEY_JWK)) {
            throw 'JATOBID_BUILD_ATTESTATION_PRIVATE_KEY_JWK is required for official release builds.'
          }
          npm run generate-build-attestation
          node -e "const value=require('./electron/resources/build-attestation.json'); if (value.gitCommitSha !== process.env.GIT_COMMIT_SHA) throw new Error('build attestation SHA does not match the validated tag commit')"

      - name: Build renderer
        working-directory: client
        run: npm run build

      - name: Build Windows NSIS EXE
        working-directory: client
        run: npx electron-builder --win nsis --publish never

      - name: Verify packaged Agent tools
        working-directory: client
        run: node scripts/verify-packaged-agent-tools.cjs --platform win32 --arch x64 --release release

      - name: Prepare exact release whitelist and manifest
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GIT_COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
          CLIENT_RELEASE_OUTPUT_DIR: client/release-publish
        run: node .github/scripts/prepare-client-release.mjs

      - name: Create compliant release notes
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JATOBID_RELEASE_FORBIDDEN_TERMS: ${{ secrets.JATOBID_RELEASE_FORBIDDEN_TERMS }}
        run: node .github/scripts/create-release-notes.mjs

      - name: Create or refresh Draft Release with exact assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $isDraft = $null
          gh release view $env:TAG_NAME --json isDraft --jq .isDraft 2>$null | ForEach-Object { $isDraft = $_ }
          if ($LASTEXITCODE -eq 0) {
            if ($isDraft -cne 'true') {
              throw "Release $env:TAG_NAME is already public; publish a new version instead of replacing it."
            }
            gh release edit $env:TAG_NAME --title $env:TAG_NAME --notes-file release_notes.md --draft=true
          } else {
            gh release create $env:TAG_NAME --title $env:TAG_NAME --notes-file release_notes.md --draft
          }
          $existingAssets = gh release view $env:TAG_NAME --json assets --jq '.assets[].name'
          foreach ($file in $existingAssets) {
            if (-not [string]::IsNullOrWhiteSpace($file)) {
              gh release delete-asset $env:TAG_NAME $file --yes
            }
          }
          gh release upload $env:TAG_NAME `
            "client/release-publish/Jato-AI-BID-$env:RELEASE_VERSION-win-x64.exe" `
            "client/release-publish/manifest.json"

      - name: Read Draft Release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: gh release view $env:TAG_NAME --json tagName,name,body,isDraft,url | Out-File -FilePath github-release.json -Encoding utf8

      - name: Upload and verify R2 version directory
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_ASSETS_DIR: client/release-publish
          GITHUB_RELEASE_JSON: github-release.json
          PREVIOUS_LATEST_PATH: .release-state/previous-latest.json
          R2_RELEASE_ACTION: publish
        run: node .github/scripts/publish-r2-release.mjs

      - name: Promote R2 latest.json
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_ASSETS_DIR: client/release-publish
          GITHUB_RELEASE_JSON: github-release.json
          PREVIOUS_LATEST_PATH: .release-state/previous-latest.json
          R2_RELEASE_ACTION: promote
        run: node .github/scripts/publish-r2-release.mjs

      - name: Verify Worker latest and full EXE download
        env:
          UPDATE_WORKER_BASE_URL: ${{ vars.UPDATE_WORKER_BASE_URL }}
          JATOBID_UPDATE_TEST_LICENSE_JSON: ${{ secrets.JATOBID_UPDATE_TEST_LICENSE_JSON }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node .github/scripts/verify-worker-release.mjs

      - name: Publish the verified GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release edit $env:TAG_NAME --draft=false
          $isDraft = gh release view $env:TAG_NAME --json isDraft --jq .isDraft
          if ($isDraft -cne 'false') {
            throw "Release $env:TAG_NAME was not finalized."
          }

      - name: Roll back latest.json after verification or finalization failure
        if: ${{ failure() && hashFiles('.release-state/previous-latest.json') != '' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_ASSETS_DIR: client/release-publish
          GITHUB_RELEASE_JSON: github-release.json
          PREVIOUS_LATEST_PATH: .release-state/previous-latest.json
          R2_RELEASE_ACTION: rollback
        run: node .github/scripts/publish-r2-release.mjs

      - name: Remove R2 versions outside the current and previous stable pair
        if: ${{ success() }}
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_ASSETS_DIR: client/release-publish
          GITHUB_RELEASE_JSON: github-release.json
          PREVIOUS_LATEST_PATH: .release-state/previous-latest.json
          R2_RELEASE_ACTION: cleanup
        run: node .github/scripts/publish-r2-release.mjs

      - name: Checkout main for release notice
        if: ${{ success() }}
        uses: actions/checkout@v5
        with:
          ref: main
          path: .release-notice-main
          fetch-depth: 1

      - name: Publish release notice to main
        if: ${{ success() }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath 'remote-notice.json' -Destination '.release-notice-main/remote-notice.json' -Force
          Push-Location '.release-notice-main'
          try {
            git config user.name 'github-actions[bot]'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to configure the Git author name.' }
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to configure the Git author email.' }
            git add remote-notice.json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to stage the generated release notice.' }
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 1) {
              git commit -m "chore: update release notice for $env:TAG_NAME"
              if ($LASTEXITCODE -ne 0) { throw 'Unable to commit the generated release notice.' }
              git push origin HEAD:main
              if ($LASTEXITCODE -ne 0) { throw 'Unable to push the generated release notice.' }
            } elseif ($LASTEXITCODE -ne 0) {
              throw 'Unable to compare the generated release notice.'
            }
          } finally {
            Pop-Location
          }

      - name: Clean transient release files
        if: ${{ always() }}
        run: |
          $ErrorActionPreference = 'Continue'
          $paths = @(
            'client/release-publish',
            'client/release',
            '.release-state',
            '.release-notice-main',
            'github-release.json',
            'release_notes.md'
          )
          foreach ($target in $paths) {
            if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          }

  release-management:
    name: Release Windows management application
    needs: release-preflight
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CLIENT_TAG: ${{ inputs.tag_name }}
      CONFIRM_RELEASE: ${{ inputs.confirm_release }}
    steps:
      - name: Checkout requested management ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.management_ref }}
          fetch-depth: 0

      - name: Validate requested ref is trusted main history
        id: trusted-ref
        run: |
          set -euo pipefail
          if [[ ! "$CLIENT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid client release tag: $CLIENT_TAG"
            exit 1
          fi
          if [[ "$CONFIRM_RELEASE" != "PUBLISH $CLIENT_TAG" ]]; then
            echo "confirm_release must exactly equal 'PUBLISH $CLIENT_TAG'."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          REQUESTED_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if ! git merge-base --is-ancestor "$REQUESTED_SHA" "$MAIN_SHA"; then
            echo "Requested ref $REQUESTED_SHA is not reachable from origin/main."
            exit 1
          fi
          echo "commit_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: management/package-lock.json

      - name: Validate independent management version
        id: validate-version
        env:
          MANAGEMENT_VERSION: ${{ inputs.management_version }}
        run: |
          MANAGEMENT_VERSION="${MANAGEMENT_VERSION#v}"
          if [[ ! "$MANAGEMENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid management version: $MANAGEMENT_VERSION"
            exit 1
          fi
          echo "version=$MANAGEMENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=management-v$MANAGEMENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Inspect management Draft Release state
        id: management-state
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANAGEMENT_TAG: ${{ steps.validate-version.outputs.tag_name }}
          MANAGEMENT_VERSION: ${{ steps.validate-version.outputs.version }}
          MANAGEMENT_COMMIT_SHA: ${{ steps.trusted-ref.outputs.commit_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseOutput = gh release view $env:MANAGEMENT_TAG --json isDraft,targetCommitish,assets 2>&1
          $releaseExitCode = $LASTEXITCODE
          if ($releaseExitCode -ne 0) {
            if (($releaseOutput | Out-String) -notmatch 'release not found') {
              throw "Unable to inspect management Release $($env:MANAGEMENT_TAG): $releaseOutput"
            }
            git show-ref --verify --quiet "refs/tags/$env:MANAGEMENT_TAG"
            $tagExitCode = $LASTEXITCODE
            if ($tagExitCode -eq 0) {
              throw "Management tag $env:MANAGEMENT_TAG exists without a Draft Release."
            }
            if ($tagExitCode -ne 1) {
              throw "Unable to inspect management tag $env:MANAGEMENT_TAG."
            }
            "mode=build" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $release = $releaseOutput | ConvertFrom-Json
          if (-not $release.isDraft) {
            throw "Management Release $env:MANAGEMENT_TAG is already public and cannot be replaced."
          }
          if ($release.targetCommitish -cne $env:MANAGEMENT_COMMIT_SHA) {
            throw "Management Draft Release targets $($release.targetCommitish), expected $env:MANAGEMENT_COMMIT_SHA."
          }
          git show-ref --verify --quiet "refs/tags/$env:MANAGEMENT_TAG"
          $tagExitCode = $LASTEXITCODE
          if ($tagExitCode -eq 0) {
            $tagCommit = (git rev-list -n 1 $env:MANAGEMENT_TAG).Trim()
            if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:MANAGEMENT_COMMIT_SHA) {
              throw "Management tag $env:MANAGEMENT_TAG does not match $env:MANAGEMENT_COMMIT_SHA."
            }
          } elseif ($tagExitCode -ne 1) {
            throw "Unable to inspect management tag $env:MANAGEMENT_TAG."
          }

          $expectedAssets = @(
            "Jato-AI-BID-Management-$env:MANAGEMENT_VERSION-win-x64.exe",
            "Jato-AI-BID-Management-$env:MANAGEMENT_VERSION-win-x64.zip",
            'SHA256SUMS.txt'
          ) | Sort-Object
          $actualAssets = @($release.assets | ForEach-Object { $_.name }) | Sort-Object
          if (($expectedAssets -join "`n") -ceq ($actualAssets -join "`n")) {
            "mode=resume" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "mode=rebuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          exit 0

      - name: Refuse management build after R2 upload started
        if: ${{ steps.management-state.outputs.mode != 'resume' }}
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          MANAGEMENT_VERSION: ${{ steps.validate-version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $endpoint = "https://$($env:R2_ACCOUNT_ID).r2.cloudflarestorage.com"
          $bucketOutput = aws s3api head-bucket --endpoint-url $endpoint --no-cli-pager --bucket jatoaibid 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect R2 bucket jatoaibid`: $bucketOutput"
          }
          $expectedAssets = @(
            "Jato-AI-BID-Management-$env:MANAGEMENT_VERSION-win-x64.exe",
            "Jato-AI-BID-Management-$env:MANAGEMENT_VERSION-win-x64.zip",
            'SHA256SUMS.txt'
          )
          foreach ($file in $expectedAssets) {
            $key = "management/$env:MANAGEMENT_VERSION/$file"
            $headOutput = aws s3api head-object --endpoint-url $endpoint --no-cli-pager --bucket jatoaibid --key $key 2>&1
            $headExitCode = $LASTEXITCODE
            if ($headExitCode -eq 0) {
              throw "Refusing to build management release because R2 object already exists: $key"
            }
            if (($headOutput | Out-String) -notmatch '404|Not Found|NoSuchKey|NotFound') {
              throw "Unable to inspect R2 object $key`: $headOutput"
            }
          }
          exit 0

      - name: Install management dependencies
        if: ${{ steps.management-state.outputs.mode != 'resume' }}
        working-directory: management
        run: npm ci

      - name: Test management application
        if: ${{ steps.management-state.outputs.mode != 'resume' }}
        working-directory: management
        run: npm test

      - name: Create temporary initial administrator credential
        if: ${{ steps.management-state.outputs.mode != 'resume' }}
        working-directory: management
        env:
          MANAGEMENT_INITIAL_ADMIN_CREDENTIAL_JSON: ${{ secrets.MANAGEMENT_INITIAL_ADMIN_CREDENTIAL_JSON }}
        run: node scripts/write-initial-admin-credential.cjs

      - name: Sync independent management version
        if: ${{ steps.management-state.outputs.mode != 'resume' }}
        working-directory: management
        env:
          MANAGEMENT_VERSION: ${{ steps.validate-version.outputs.version }}
        run: npm version "$MANAGEMENT_VERSION" --no-git-tag-version --allow-same-version

      - name: Build and verify Windows management application
        if: ${{ steps.management-state.outputs.mode != 'resume' }}
        working-directory: management
        run: npm run dist:win

      - name: Prepare exact management Artifact
        if: ${{ steps.management-state.outputs.mode != 'resume' }}
        working-directory: management
        env:
          MANAGEMENT_VERSION: ${{ steps.validate-version.outputs.version }}
        run: node scripts/prepare-release-artifacts.cjs

      - name: Remove temporary initial administrator credential
        if: ${{ always() }}
        working-directory: management
        run: rm -f initial-admin.private.json

      - name: Download existing management Draft assets
        if: ${{ steps.management-state.outputs.mode == 'resume' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANAGEMENT_TAG: ${{ steps.validate-version.outputs.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path management/release-artifact -Force | Out-Null
          gh release download $env:MANAGEMENT_TAG --dir management/release-artifact

      - name: Create or repair management Draft Release
        if: ${{ steps.management-state.outputs.mode != 'resume' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANAGEMENT_TAG: ${{ steps.validate-version.outputs.tag_name }}
          MANAGEMENT_VERSION: ${{ steps.validate-version.outputs.version }}
          MANAGEMENT_COMMIT_SHA: ${{ steps.trusted-ref.outputs.commit_sha }}
          MANAGEMENT_MODE: ${{ steps.management-state.outputs.mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            "## 管理端 $env:MANAGEMENT_VERSION",
            '',
            "源码提交：``$env:MANAGEMENT_COMMIT_SHA``"
          ) | Out-File -FilePath management-release-notes.md -Encoding utf8

          if ($env:MANAGEMENT_MODE -ceq 'build') {
            gh release create $env:MANAGEMENT_TAG --title "Management $env:MANAGEMENT_VERSION" --notes-file management-release-notes.md --draft --target $env:MANAGEMENT_COMMIT_SHA
          } else {
            $existingAssets = gh release view $env:MANAGEMENT_TAG --json assets --jq '.assets[].name'
            foreach ($file in $existingAssets) {
              if (-not [string]::IsNullOrWhiteSpace($file)) {
                gh release delete-asset $env:MANAGEMENT_TAG $file --yes
              }
            }
          }
          gh release upload $env:MANAGEMENT_TAG `
            "management/release-artifact/Jato-AI-BID-Management-$env:MANAGEMENT_VERSION-win-x64.exe" `
            "management/release-artifact/Jato-AI-BID-Management-$env:MANAGEMENT_VERSION-win-x64.zip" `
            "management/release-artifact/SHA256SUMS.txt"

      - name: Upload and verify immutable management R2 version directory
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MANAGEMENT_VERSION: ${{ steps.validate-version.outputs.version }}
          RELEASE_ASSETS_DIR: management/release-artifact
          R2_RELEASE_ACTION: publish-management
        run: node .github/scripts/publish-r2-release.mjs

      - name: Clean transient management release files
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $paths = @(
            'management/initial-admin.private.json',
            'management/release-artifact',
            'management/release',
            'management-release-notes.md'
          )
          foreach ($target in $paths) {
            if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          }
