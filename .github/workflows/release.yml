name: Release Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布的已有 tag，例如 v1.3.2'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: openjatobid-client-release
  cancel-in-progress: false

env:
  OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION || 'v1.17.8' }}
  RIPGREP_VERSION: ${{ vars.RIPGREP_VERSION || '14.1.1' }}
  FD_VERSION: ${{ vars.FD_VERSION || 'v10.3.0' }}
  JQ_VERSION: ${{ vars.JQ_VERSION || 'jq-1.7.1' }}

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate tag and checkout commit
        id: release
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG_NAME"
            exit 1
          fi
          COMMIT_SHA="$(git rev-parse HEAD)"
          TAG_COMMIT_SHA="$(git rev-list -n 1 "$TAG_NAME")"
          if [ "$COMMIT_SHA" != "$TAG_COMMIT_SHA" ]; then
            echo "Checkout commit $COMMIT_SHA does not match tag commit $TAG_COMMIT_SHA."
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Test release scripts and Worker update routes
        run: >-
          node --test
          .github/scripts/prepare-client-release.test.mjs
          .github/scripts/publish-r2-release.test.mjs
          .github/scripts/verify-worker-release.test.mjs
          .github/scripts/release-workflow.test.mjs
          analytics/worker/src/routes/updates.test.js

  build-windows:
    name: Build Windows client
    needs: validate-release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test update integrity checks
        run: npm run test:update

      - name: Prepare OpenCode binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_VERSION: ${{ env.OPENCODE_VERSION }}
        run: node scripts/prepare-opencode-binary.cjs --platform win32 --arch x64

      - name: Verify OpenCode binary
        run: node scripts/verify-opencode-binary.cjs --platform win32 --arch x64

      - name: Prepare OpenCode tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RIPGREP_VERSION: ${{ env.RIPGREP_VERSION }}
          FD_VERSION: ${{ env.FD_VERSION }}
          JQ_VERSION: ${{ env.JQ_VERSION }}
        run: node scripts/prepare-opencode-tools.cjs --platform win32 --arch x64

      - name: Verify OpenCode tools
        run: node scripts/verify-opencode-tools.cjs --platform win32 --arch x64

      - name: Rebuild Electron native dependencies
        run: npm run postinstall

      - name: Smoke test Electron native dependencies
        run: npm run smoke:electron-native

      - name: Sync package version from tag
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Generate signed build attestation
        env:
          JATOBID_BUILD_ATTESTATION_PRIVATE_KEY_JWK: ${{ secrets.JATOBID_BUILD_ATTESTATION_PRIVATE_KEY_JWK }}
          JATOBID_BUILD_ATTESTATION_KEY_ID: ${{ vars.JATOBID_BUILD_ATTESTATION_KEY_ID || 'jatobid-build-key-2026-07' }}
          GIT_COMMIT_SHA: ${{ needs.validate-release.outputs.commit_sha }}
        run: |
          if [ -z "$JATOBID_BUILD_ATTESTATION_PRIVATE_KEY_JWK" ]; then
            echo "JATOBID_BUILD_ATTESTATION_PRIVATE_KEY_JWK is required for official release builds."
            exit 1
          fi
          npm run generate-build-attestation
          node -e "const value=require('./electron/resources/build-attestation.json'); if (value.gitCommitSha !== process.env.GIT_COMMIT_SHA) throw new Error('build attestation SHA does not match the validated tag commit')"

      - name: Build renderer
        run: npm run build

      - name: Build Windows NSIS EXE
        run: npx electron-builder --win nsis --publish never

      - name: Verify packaged OpenCode binary
        run: node scripts/verify-packaged-opencode-binary.cjs --platform win32 --arch x64 --release release

      - name: Verify packaged OpenCode tools
        run: node scripts/verify-packaged-opencode-tools.cjs --platform win32 --arch x64 --release release

      - name: Prepare exact release whitelist and manifest
        env:
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
          GIT_COMMIT_SHA: ${{ needs.validate-release.outputs.commit_sha }}
        run: node ../.github/scripts/prepare-client-release.mjs

      - name: Upload prepared client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-release-${{ needs.validate-release.outputs.tag_name }}
          path: client/release-publish/*
          if-no-files-found: error
          retention-days: 7

  publish-draft-release:
    name: Publish GitHub Draft Release
    needs:
      - validate-release
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.tag_name }}

      - name: Download prepared client artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-release-${{ needs.validate-release.outputs.tag_name }}
          path: release-assets

      - name: Create release notes from commits
        shell: bash
        env:
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$TAG_NAME"
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${TAG_NAME}"
          else
            RANGE="$TAG_NAME"
            COMPARE_URL="https://github.com/${{ github.repository }}/commits/${TAG_NAME}"
          fi
          {
            echo "## 更新内容"
            echo
            git log "$RANGE" --no-merges --pretty=format:'- %s (%h)' || true
            echo
            echo
            echo "**Full Changelog**: $COMPARE_URL"
          } > release_notes.md

      - name: Create or refresh Draft Release with exact assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release $TAG_NAME is already public; publish a new version instead of replacing it."
              exit 1
            fi
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file release_notes.md --draft=true
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file release_notes.md --draft
          fi
          files=(
            "Jato-AI-BID-${RELEASE_VERSION}-win-x64.exe"
            "manifest.json"
          )
          mapfile -t existing_assets < <(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')
          for file in "${existing_assets[@]}"; do
            gh release delete-asset "$TAG_NAME" "$file" --yes
          done
          upload_files=()
          for file in "${files[@]}"; do upload_files+=("release-assets/$file"); done
          gh release upload "$TAG_NAME" "${upload_files[@]}"

  publish-r2-release:
    name: Publish private R2 and finalize release
    needs:
      - validate-release
      - publish-draft-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install AWS CLI
        run: |
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version 2>&1 | grep '^aws-cli/2\.'

      - name: Download prepared client artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-release-${{ needs.validate-release.outputs.tag_name }}
          path: release-assets

      - name: Read Draft Release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
        run: gh release view "$TAG_NAME" --json tagName,name,body,isDraft,url > github-release.json

      - name: Upload and verify R2 version directory
        env:
          R2_ACCOUNT_ID: 53d21f8ee647e4b1877d5147e1424636
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
          RELEASE_ASSETS_DIR: release-assets
          GITHUB_RELEASE_JSON: github-release.json
          PREVIOUS_LATEST_PATH: .release-state/previous-latest.json
          R2_RELEASE_ACTION: publish
        run: node .github/scripts/publish-r2-release.mjs

      - name: Promote R2 latest.json
        id: promote
        env:
          R2_ACCOUNT_ID: 53d21f8ee647e4b1877d5147e1424636
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
          RELEASE_ASSETS_DIR: release-assets
          GITHUB_RELEASE_JSON: github-release.json
          PREVIOUS_LATEST_PATH: .release-state/previous-latest.json
          R2_RELEASE_ACTION: promote
        run: node .github/scripts/publish-r2-release.mjs

      - name: Verify Worker latest and full EXE download
        env:
          UPDATE_WORKER_BASE_URL: https://bidupdat.migrant1124.workers.dev
          JATOBID_UPDATE_TEST_LICENSE_JSON: ${{ secrets.JATOBID_UPDATE_TEST_LICENSE_JSON }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: node .github/scripts/verify-worker-release.mjs

      - name: Publish the verified GitHub Release
        id: finalize
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
        run: |
          gh release edit "$TAG_NAME" --draft=false
          test "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)" = "false"

      - name: Roll back latest.json after verification or finalization failure
        if: ${{ failure() && hashFiles('.release-state/previous-latest.json') != '' }}
        env:
          R2_ACCOUNT_ID: 53d21f8ee647e4b1877d5147e1424636
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
          RELEASE_ASSETS_DIR: release-assets
          GITHUB_RELEASE_JSON: github-release.json
          PREVIOUS_LATEST_PATH: .release-state/previous-latest.json
          R2_RELEASE_ACTION: rollback
        run: node .github/scripts/publish-r2-release.mjs

      - name: Remove R2 versions outside the current and previous stable pair
        if: ${{ success() }}
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: 53d21f8ee647e4b1877d5147e1424636
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
          RELEASE_ASSETS_DIR: release-assets
          GITHUB_RELEASE_JSON: github-release.json
          PREVIOUS_LATEST_PATH: .release-state/previous-latest.json
          R2_RELEASE_ACTION: cleanup
        run: node .github/scripts/publish-r2-release.mjs
