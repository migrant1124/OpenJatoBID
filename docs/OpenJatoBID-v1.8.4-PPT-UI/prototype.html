function card(type,i){let t=type==='template',row=decks[i],title=t?row[0]:promptNames[i],img=t?row[3]:`prompt-${i+1}.jpg`;return `<article class="card" data-title="${title}"><button class="preview" onclick="preview('${type}',${i})" aria-label="${t?'查看 PPT 首页':'查看参考图片'}"><img src="assets/${img}" alt="${title}"><span class="zoom">${icon('zoom')}</span></button><h4>${title}</h4><div class="cardmeta"><span>${t?row[2]:'公开提示词 · 示例'}</span><span class="tag ${t&&i===0?'blue':''}">${t?(i===0?'原生样本':'界面示例'):'本周新增'}</span></div><p>${t?(i===0?'原页面文字、形状可独立读取和替换；保留原始比例。':'展示模板卡片及首页预览交互，不表示上游资源已经验收。'):'以简洁构图组织主体、材质和背景，保持视觉层次，按当前需求调整表达。'}</p><footer>${btn(t?'查看首页':'查看详情',`preview('${type}',${i})`)}${btn(t?'使用此模板':'使用提示词',t?"go('workspace')":"note('示意：填入现有生图输入框，不自动开始生成')",true)}</footer></article>`}

function management(){document.getElementById('windowtitle').textContent='Jato AI BID 管理端';return `<div class="shell"><aside class="mgsidebar"><div class="mgbrand"><img src="assets/app-icon.png"><div><strong>Jato AI BID</strong><span class="sub">管理端</span></div></div><nav><button>授权管理</button><button>运维统计</button><button class="active">资源中心</button><button>系统设置</button></nav><button class="logout">退出管理界面</button></aside><main class="mgmain"><header class="mgheader"><div><span class="sub">公共资源管理</span><h1>资源中心</h1></div><span class="service"><i></i>局域网服务运行中 · 0.0.0.0:47821</span></header><section class="panel"><div class="spread"><div><h2>自动更新与发布</h2><p>每周检查已启用的公共源，有实际变化且校验通过后自动发布。</p></div><div class="actions"><span class="tag blue">固定周期：每 7 天</span>${btn('立即检查',"note('手动检查不改变固定一周的定时锚点')",true)}</div></div><div class="schedulefoot"><span>上次检查：本周（示例）</span><span>下次定时检查：7 天后（示例）</span><a style="margin-left:auto" onclick="note('使用管理端本机的网络环境，资源目录独立选择')">网络与存储设置</a></div></section><div class="metrics"><div class="metric"><label>生图提示词中心</label><strong>24 <small>条新增</small> / 6 <small>条更新</small></strong><small>正文、标签与参考图同步（示例数量）</small></div><div class="metric"><label>PPT 模板中心</label><strong>4 <small>套整套</small> / 8 <small>个单页</small></strong><small>首页缩略图随资源版本发布（示例数量）</small></div><div class="metric"><label>客户端通知</label><strong>上线后合并提醒</strong><small>无更新不弹出，已看过不重复打扰</small></div></div><div class="tablepanel"><div class="tablehead"><div class="seg"><button class="active">全部资源</button><button>生图提示词</button><button>PPT 模板</button><button>Skill</button></div>${btn('发布记录',"go('update')")}</div><table><thead><tr><th style="width:25%">来源</th><th>同步内容</th><th>当前状态</th><th>使用边界</th><th>操作</th></tr></thead><tbody><tr><td><strong>生图公共提示词</strong><small>保留现有 7 个 source_id</small></td><td>正文 / 标签 / 参考图片</td><td><span class="tag green">同步完成 · 示例</span></td><td>填入生图输入框</td><td>${btn('查看',"go('prompts')")}</td></tr><tr><td><strong>wuhua PPT 模板</strong><small>wuhua2026/ppt-templates</small></td><td>PPTX / 首页缩略图</td><td><span class="tag blue">原生页面样本已核查</span></td><td>独立文字、形状可替换</td><td>${btn('查看样本',"go('preview')")}</td></tr><tr><td><strong>Free PPT Template</strong><small>ai-ppt-template/free-ppt-template</small></td><td>索引 / 预览 / PPTX</td><td><span class="tag orange">直接复用尚未确认</span></td><td>先作为视觉参考候选</td><td>${btn('详情',"note('当前未取得可检查的 CDN PPTX，不能声明全库原生可编辑')")}</td></tr><tr><td><strong>ppt-master</strong><small>受管 Skill 与完整资源</small></td><td>工作流 / 脚本 / 模板</td><td><span class="tag">版本固定</span></td><td>候选更新不自动获得执行权</td><td>${btn('查看',"go('skills')")}</td></tr></tbody></table></div><div class="twocol"><section class="panel"><div class="spread"><h2>最近发布</h2><a onclick="go('update')">查看概括</a></div><p>两中心实际变化合并为一条资源更新记录。</p><p class="sub">无实际变化仅记录检查时间；失败保留旧快照。</p></section><section class="panel"><div class="spread"><h2>资源存储</h2>${btn('打开目录',"note('打开应用资源存储目录')")}</div><p>D:\\JatoResources</p><p class="sub">资源与安装包分离；未知磁盘数据不显示为 0。</p></section></div></main></div>`}
function dialog(title,sub,body,foot,cls=''){return `<div class="overlay" id="modal"><div class="dialog ${cls}" role="dialog" aria-modal="true"><div class="dhead"><div><h2>${title}</h2><p>${sub}</p></div><button class="close" onclick="closeModal()" aria-label="关闭">×</button></div><div class="dbody">${body}</div><div class="dfoot">${foot}</div></div></div>`}function closeModal(){document.getElementById('modal')?.remove()}function modal(h){closeModal();document.body.insertAdjacentHTML('beforeend',h)}
