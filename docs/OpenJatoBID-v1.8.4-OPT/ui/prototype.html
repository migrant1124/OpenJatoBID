const ico=(name='doc')=>{const path={doc:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h4M10 12h5M10 16h5"/>',ppt:'<rect x="4" y="4" width="16" height="12" rx="2"/><path d="M12 16v5M8 21h8M8 9h8M8 12h5"/>',chat:'<path d="M4 4h16v12H9l-5 4z"/><path d="M8 8h8M8 12h5"/>',image:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="15" cy="8" r="2"/>',folder:'<path d="M3 6h7l2 3h9v11H3z"/>',setting:'<circle cx="12" cy="12" r="3"/><path d="m12 2 2 4 4-1 1 4 3 3-3 3-1 4-4-1-2 4-2-4-4 1-1-4-3-3 3-3 1-4 4 1z"/>',clip:'<path d="m8 14 7-7a3 3 0 0 1 4 4l-9 9a5 5 0 0 1-7-7l9-9"/>',check:'<path d="m5 12 4 4L19 6"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'}[name]||'';return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`};

function slide(r43=false,label=true){return `<div class="slide-art ${r43?'ratio43':''}"><div class="slide-kicker">PROJECT DELIVERY</div><h2>实施流程与响应机制</h2><p>围绕需求、制作和交付，形成清晰可执行的工作安排</p><div class="slide-steps"><div class="slide-step"><b>01　需求对接</b><span>明确目标与任务<br>确认交付范围</span></div><div class="slide-step"><b>02　设计制作</b><span>形成方案并执行<br>过程检查与优化</span></div><div class="slide-step"><b>03　交付验收</b><span>完成交付与复核<br>响应后续需求</span></div></div><div class="slide-footer"><span>服务方案 · 设计演示内容</span><span>01</span></div>${label?'<span class="slide-label">示例页面</span>':''}</div>`}
function composer(s,compact=false){const single=['C14','C20','C28'].includes(s.id);const filled=['C02','C14'].includes(s.id);let attach=s.id==='C02'?'<div class="attach-list"><div class="attach-item">'+ico('doc')+'项目资料.pdf <span>×</span></div><div class="attach-item">'+ico('doc')+'实施说明.docx <span>×</span></div></div>':'';return `<div class="composer"><textarea aria-label="PPT需求输入" placeholder="${compact?'继续补充需求，或说明需要修改的内容…':'描述你的主题、用途和受众，或上传文档开始制作…'}">${filled?E(s.description):''}</textarea>${attach}<div class="composer-tools"><div class="toolgroup">${btn(ico('clip')+' 上传资料','C02')}${btn(ico('doc')+' ppt-master ▾','C05')}${btn(ico('ppt')+' 选择模板','C10')}<div class="scope-switch">${btn('整套 PPT','C01',single?'':'active')}${btn('单页 PPT','C14',single?'active':'')}</div></div><button class="send" data-go="${s.next}" aria-label="发送">↑</button></div></div>`}

function adminBase(s){let selection=['A02','A03'].includes(s.id),queue=s.id==='A04',partial=['A05','A06'].includes(s.id);let sources=['生图提示词来源 A','整套模板来源 B','单页版式来源 C','其他公开来源 D'];return `<section class="admin-body"><header class="pagehead"><div><h1>资源中心</h1><p>管理公共资源来源、同步任务与本地镜像</p></div>${btn('同步审计与只读计划','A06')}</header><article class="card"><div class="cardhead"><div><h2>公共资源同步</h2><p>固定每周一次 · 关闭窗口后驻托盘；退出服务或关机时停止</p></div><span class="tag ${queue?'blue':'green'}">${queue?'正在同步':'调度运行中'}</span></div><div class="cardbody"><div class="metrics"><div class="metric">镜像体积 <strong>12.30 GB</strong></div><div class="metric">可用空间 <strong>256.00 GB</strong></div><div class="metric">资源目录 <strong>1,286 项</strong></div><div class="metric">已启用来源 <strong>${selection?'0':'3'} / 4</strong></div></div>${partial?'<div class="state-summary">部分资源待更新，现有资源可继续使用。 <button class="text" data-go="A06">查看详情</button></div>':''}</div></article><article class="card table-card"><div class="tabletools"><h2>公共来源</h2><div class="row"><input placeholder="搜索来源" aria-label="搜索来源">${btn('检查已启用来源','A13')}</div></div><div class="tablewrap"><table><thead><tr><th style="width:34%">来源</th><th style="width:9%">启用</th><th style="width:24%">状态</th><th>最近检查</th><th>操作</th></tr></thead><tbody>${sources.map((name,i)=>{let status=i===3?'未启用':selection?'待确认启用':queue?(i===0?'正在同步':'等待同步'):partial&&i===0?'部分资源待更新':'已检查，无更新';return `<tr><td>${name}<small>${i===0?'公共提示词':i===1?'整套演示模板':i===2?'单页版式':'候选资源来源'}</small></td><td><input type="checkbox" aria-label="启用${name}" ${i<3?'checked':''} data-go="A02"></td><td><span class="tag ${status==='正在同步'?'blue':status==='部分资源待更新'?'amber':''}">${status}</span>${queue&&i===0?'<div class="progress"><i></i></div>':''}</td><td>${i===3||selection?'—':'2026-10-05 16:19'}</td><td>${btn('详情','A06','text')}</td></tr>`}).join('')}</tbody></table></div>${selection?`<div class="selectionbar"><span>已修改 <strong>3</strong> 个来源 · 尚未开始下载</span><div class="row">${btn('取消修改','A01')}${btn('确认并加入队列', if(s.view==='location')return `<div class="form"><label>项目名称<input value="项目服务方案演示"></label><label>保存父目录<div class="row"><input value="D:\\JatoProjects">${btn('选择目录','C48')}</div></label><label class="checked"><input type="checkbox">将此位置设为新项目的默认父目录</label><p class="small">将在所选父目录中创建独立项目子目录。</p></div>`;if(s.view==='settings')return `<div class="form"><label>镜像目录<div class="row"><input value="D:\\JatoResources" readonly>${btn('选择目录','A09')}</div></label><div class="pair"><label>配额（GB）<input value="100" type="number"></label><label>网络<select><option>使用系统网络设置</option><option>管理端专用代理</option></select></label></div><p class="small">代理只用于公共资源获取，不影响局域网授权与统计。</p><div>${btn('清理无任务占用的暂存','A12','text')}</div></div>`;if(s.view==='chart')return `<div class="form"><label>当前页图表<select><option>图表1 · 阶段对比（示例对象）</option></select></label><table class="data-grid"><thead><tr><th>类别</th><th>系列A</th><th>系列B</th></tr></thead><tbody>${['阶段一','阶段二','阶段三'].map((v,i)=>`<tr><td><input value="${v}"></td><td><input value="${[12,20,16][i]}"></td><td><input value="${[10,18,15][i]}"></td></tr>`).join('')}</tbody></table><p class="small">图表画面与工作簿同步更新；示例数值不代表任何真实项目。</p></div>`;if(s.view==='notes')return `<div class="form"><label>第2页讲稿<textarea style="height:190px">${E(s.items[0])}</textarea></label><p class="small">未保存时切换页面会提示保留修改。</p></div>`;if(s.view==='edit')return `<div class="form"><label>当前页文字对象<select><option>实施流程与响应机制</option></select></label><label>文字<textarea>实施流程与响应机制</textarea></label><div class="pair"><label>字号<input type="number" value="28"></label><label>颜色<input value="#143456"></label></div></div>`;if(s.view==='annotations')return `<div class="form"><label>当前页批注<textarea placeholder="说明需要修改的位置和内容…">简化第二段说明，保留关键交付条件。</textarea></label>${s.items.slice(0,2).map(v=>`<label class="checked"><input type="checkbox" checked>${E(v)}</label>`).join('')}</div>`;if(s.view==='history')return `<div class="form">${s.items.slice(0,2).map((v,i)=>`<label class="radio"><input type="radio" name="history" ${i===0?'checked':''}>${E(v)}</label>`).join('')}<div class="warningbox">恢复会创建新的稿件修订，当前稿不会被删除。</div></div>`;if(s.view==='export')return `<div class="formatgrid">${['PPTX','PDF','图片','讲稿'].map((v,i)=>`<div class="formatcard ${i===0?'selected':''}"><div class="format-icon">${['P','PDF','PNG','MD'][i]}</div><div><strong>${v}</strong><small>${['演示文稿','固定版式','逐页图片','Markdown'][i]}</small></div></div>`).join('')}</div><div class="form" style="margin-top:20px"><label>导出页面<select><option>整稿</option><option>当前页</option></select></label><div class="dialog-nav">${btn('本地旁白与逐页视频','C59','text')}</div></div>`;if(s.view==='review')return `<div class="form">${s.items.map(v=>`<div class="detail-card">${E(v)}</div>`).join('')}<label class="checked"><input type="checkbox">我已核对本次交付的内容、页面范围和必要事实。</label></div>`;if(s.view==='skillimport')return `<div class="row wrap" style="margin-bottom:18px">${btn('技能文件','C07')+btn('普通Markdown','C62')}${btn('完整文件夹','C07')}${btn('ZIP技能包','C07')}</div><div class="form"><label>公开GitHub仓库或子目录<input placeholder="粘贴技能仓库地址"></label><div>${btn('请求管理端获取','C08','text')}</div><div>${btn('查看技能位置与卸载','C58','text')}</div></div>`;if(s.view==='skillpicker')return `<label class="skillrow selected"><input type="radio" name="skill" checked><div class="grow"><strong>ppt-master <span class="tag blue">内置默认</span></strong><p>演示规划、页面制作、编辑与导出 · 使用前校验固定组件</p></div></label><label class="skillrow"><input type="radio" name="skill"><div class="grow"><strong>个人演示写作技能</strong><p>方法参考可用；脚本执行以真实授权和兼容性为准</p></div></label><div class="dialog-nav">${btn('管理技能','C06','text')}</div>`;if(s.view==='media')return `<div class="form"><label>本地旁白音频<div class="row"><input placeholder="尚未选择本地音频">${btn('选择音频','C59')}</div></label><label class="checked"><input type="checkbox">启用逐页静态视频（沿用现有能力）</label><div class="warningbox">原PPT全部动画不转换；没有授权不发起收费配音。</div></div>`;if(s.view==='storage')return `<div class="form"><label>操作<select><option>迁移当前项目</option><option>资源缓存位置</option><option>清理当前缓存</option></select></label><label>目标父目录<div class="row"><input placeholder="选择可写入的位置">${btn('选择位置','C48')}</div></label><p class="small">复制、校验后切换索引，原副本保留；不删除外部原件。</p><div class="dialog-nav">${btn('保存为我的模板','C55','text')}${btn('删除与恢复项目副本','C57','text')}${btn('重命名项目','C61','text')}</div></div>`;return list(s.items)}
function modal(s){let wide=['templates','templatepreview'].includes(s.view),medium=['audit','plan','chart','review','releases','repositories'].includes(s.view);let body='';if(s.view==='templates'){body=`<div class="template-tools"><input placeholder="搜索模板"><select><option>全部画幅</option><option>16:9</option><option>4:3</option></select>${btn('整套模板','C10','active')}${btn('单页版式','C10')}${btn('我的模板','C10')}</div><div class="template-grid">${['商务汇报','项目方案','实施流程','工作总结','简洁白底','深度说明'].map((v,i)=>`<article class="template-card ${i===0?'selected':''}" data-go="C11"><div class="coverframe">${slide(i===2)}</div><div class="template-copy"><strong>${v} · 示例</strong><p>${i===2?'4:3':'16:9'} · 能力以实际文件检查为准</p></div></article>`).join('')}</div><div class="dialog-nav">${btn('不使用模板，交给Agent设计','C01','text')}</div>`}else if(s.view==='templatepreview'){body=`<div class="preview-layout">${slide(true)}<div class="detailsbox"><h3>商务汇报 · 示例模板</h3>${s.items.map(v=>`<p>${E(v)}</p>`).join('')}<p class="small">完整首页显示；本参考图不是真实公共模板预览。</p></div></div>`}else if(s.view==='audit'||s.view==='plan'){body=`<div class="audit-tabs">${btn('运行记录','A06',s.view==='audit'?'active':'')}${btn('周计划','A07',s.view==='plan'?'active':'')}</div>`;if(s.view==='audit')body+=`<div class="audit-filters"><select><option>全部来源</option></select><select><option>全部结果</option><option>部分完成</option></select><input value="2026-10-05"></div><div class="audit-item"><div class="row between"><strong>生图提示词来源 A</strong><span class="tag amber">部分完成</span></div><p>2026-10-05 16:19 · 14项准备未完成</p><p>已成功和旧条目保留分别统计。具体原因须从真实ITEM_FAILED审计读取。</p><details><summary>技术详情（主动展开）</summary><pre>taskId: 由真实任务返回\nsourceId: 稳定来源ID\nphase: 按真实失败阶段\nerrorCode: 不编造根因\n凭据与敏感路径已脱敏</pre></details></div><div class="row between"><span class="small">按需查询 · 分页加载</span>${btn('导出脱敏诊断','A06','text')}</div>`;else body+=`<div class="detail-card"><strong>固定每7天一次</strong>周期不可编辑，手动检查和重试不移动周锚点。</div><table><thead><tr><th>来源</th><th>下次检查</th><th>状态</th></tr></thead><tbody>${['提示词来源 A','整套模板来源 B','单页版式来源 C'].map(v=>`<tr><td>${v}</td><td>2026-10-12 16:19</td><td>已启用</td></tr>`).join('')}</tbody></table><p class="diagnostic">此表为设计示例；真实时间由持久化周锚点计算。</p>`}else if(s.view==='releases'){body=s.items.map(v=>`<div class="detail-card">${E(v)}</div>`).join('')}else if(s.view==='repositories'){body=`<div class="detail-card"><strong>公开技能仓库获取申请</strong><p>申请对象：公开仓库与指定技能目录</p><p>当前状态：待处理</p></div>${list(s.items)}<div class="dialog-nav">${btn('拒绝本次申请','A01','text')}</div>`}else{body=formRows(s)}let secondary='';if(s.id==='C13')secondary=btn('按项目画幅重新布局','C12');if(s.id==='C48'||s.id==='A09')secondary=btn('重新选择（推荐）',s.back);if(s.id==='C50')secondary=btn('放弃未保存修改','C00');if(s.id==='C58')body+=`<label class="form checked" style="margin-top:16px"><input type="checkbox">连同项目固定版本删除（需另行明确确认影响）</label>`;return `<div class="overlay"><section class="modal ${wide?'wide':medium?'medium':''}" role="dialog" aria-modal="true"><header class="modalhead"><h2>${E(s.title.split(' · ').slice(1).join(' · ')||s.title)}</h2><button class="close" data-go="${s.back}" aria-label="关闭">×</button></header><div class="modalbody"><p class="desc">${E(s.description)}</p>${body}</div><footer class="modalfoot">${btn('取消 / 返回',s.back)}${secondary}${btn(E(s.action),s.next,'primary')}</footer></section></div>`}
function isModal(s){return s.base==='admin'&&!['overview','selection','queue','partial'].includes(s.view)||s.base==='agent'&&!['empty','attachments','single'].includes(s.view)||s.base==='workspace'&&!['normal','singlework'].includes(s.view)||s.view==='modal'}
function show(){const id=location.hash.slice(1)||'C01';const s=STATES.find(x=>x.id===id)||STATES.find(x=>x.id==='C01');window.currentScreen=s.id;const admin=s.base==='admin';document.documentElement.className=admin?'admin':'';let content=admin?adminBase(s):s.base==='home'?`<div class="preserved"><span class="tag">保留区 · 不是首页改稿</span><h2>这里沿用现有 PPT 首页</h2><p>不增加新的首页布局，也不修改一级导航。<br>本次只把“开始制作PPT”直接连接到Agent对话页。</p>${btn('开始制作 PPT →','C01','primary')}<div class="homeflow">开始制作 → 同页对话与选择 → 原制作工作区</div></div>`:s.base==='workspace'?workspace(s):s.base==='chat'?chat(s):welcome(s);if(isModal(s))content+=modal(s);document.getElementById('root').innerHTML=`<div class="windowbar"><span>佳图智能投标助手${admin?' · 管理端':''}</span><span>— □ ×</span></div><div class="app">${sidebar(admin)}<main class="main">${admin?'':modulebar(s)}${content}</main></div><footer class="reviewbar"><div class="label"><b>${s.id}</b>　${E(s.title)} <span class="screen-note">　设计参考 · 非软件运行截图 · 示例数据</span></div><div class="review-controls">${btn('上一个',STATES[Math.max(0,STATES.indexOf(s)-1)].id)}<select aria-label="画面目录">${STATES.map(v=>`<option value="${v.id}" ${v.id===s.id?'selected':''}>${v.id} ${E(v.title)}</option>`).join('')}</select>${btn('下一个',STATES[Math.min(STATES.length-1,STATES.indexOf(s)+1)].id)}</div></footer>`;document.title=s.id+' '+s.title+' · OPT-D1 设计参考';}
document.addEventListener('click',e=>{const x=e.target.closest('[data-go]');if(x&&!x.disabled){e.preventDefault();location.hash=x.dataset.go;}});document.addEventListener('change',e=>{if(e.target.matches('.reviewbar select'))location.hash=e.target.value;});document.addEventListener('keydown',e=>{if(e.key==='Escape'){const s=STATES.find(x=>x.id===window.currentScreen);if(s&&isModal(s))location.hash=s.back;}});window.addEventListener('hashchange',show);show();
</script></body></html>
